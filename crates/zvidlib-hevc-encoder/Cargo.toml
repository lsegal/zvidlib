[package]
name = "zvidlib-hevc-encoder"
description = "Pure-Rust HEVC software encoder for zvidlib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
# Tests, their fixtures and benchmarks are not needed to build the crate.
exclude = ["/tests", "/benches"]

[build-dependencies]
zvidlib-build = { workspace = true }

[dependencies]
zvidlib-core = { workspace = true }
zvidlib-color = { workspace = true }
zvidlib-hevc-syntax = { workspace = true }
zvidlib-hevc = { workspace = true }
zvidlib-hardware = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
zvidlib-bench-support = { path = "../zvidlib-bench-support" }
zvidlib-container = { path = "../zvidlib-container" }
zvidlib-hevc-decoder = { path = "../zvidlib-hevc-decoder" }
zvidlib-hardware = { path = "../zvidlib-hardware" }

[features]
default = ["hardware"]
# The platform hardware backends (NVDEC, Media Foundation, VideoToolbox). With
# it off the crate is pure Rust, and `HardwarePreference::Require` reports
# `HardwareUnavailable` as it does on a host without a backend (#635).
hardware = ["dep:zvidlib-hardware"]
# Additive, off by default, and gating no code: the benchmark harness folds it
# into every criterion group name (`simd=off` / `simd=on`), as zvidlib's own
# `simd` feature does, so the two arms are recorded separately.
simd = []

# The HEVC encoder benchmarks are their own target: they use only the synthetic
# inputs from `benches/support`, never the decoded-fixture cache the `codec`
# target exists to share, and the encoder's mode search is slow enough that it is
# worth keeping out of that target's default run.
[[bench]]
name = "hevc_encode"
harness = false
