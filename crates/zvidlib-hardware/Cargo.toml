[package]
name = "zvidlib-hardware"
description = "Platform hardware video backends (NVDEC, Media Foundation, VideoToolbox) for zvidlib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[build-dependencies]
zvidlib-build = { workspace = true }

[dependencies]
zvidlib-core = { workspace = true }
zvidlib-color = { workspace = true }
zvidlib-hevc-syntax = { workspace = true }
zvidlib-vp9-syntax = { workspace = true }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
libloading = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-cf = { workspace = true }
videotoolbox = { workspace = true }

# The tests round-trip each backend's output through zvidlib's own codecs.
# These are path-only so they are dropped from the published manifest, which
# would otherwise name crates that depend on this one.
[dev-dependencies]
zvidlib-container = { path = "../zvidlib-container" }
zvidlib-hevc-decoder = { path = "../zvidlib-hevc-decoder" }
zvidlib-hevc-encoder = { path = "../zvidlib-hevc-encoder" }
zvidlib-vp9-decoder = { path = "../zvidlib-vp9-decoder" }
