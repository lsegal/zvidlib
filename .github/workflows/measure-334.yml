# Temporary: the x86_64 measurement for issue #334, removed before this branch
# merges. Timed runs in `ci.yml` are `main`-only, and the band-offset harness is
# an `#[ignore]`d test rather than a criterion group, so this is the way to draw
# x86_64 hosts for it from a branch.
name: Measure #334 (band offset on x86_64)

on:
  pull_request:
    paths:
      - '.github/workflows/measure-334.yml'
      - 'src/hevc/engine/encoder/recon_simd.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  band-offset:
    name: band offset (${{ matrix.os }} draw ${{ matrix.draw }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The nine-draw sweep that produced the recorded per-model table has
        # already run; these two re-confirm bit-exactness and the ratio after
        # the merge from main rather than re-taking the table.
        draw: [1]
        include:
          - os: macos-15-intel
            draw: 1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      # `alsa-sys` is reached through the dev-dependency graph even without
      # `--features native`, so the lib tests do not build on Linux without it.
      - name: Install native audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Report the host
        run: |
          uname -m
          if [ -r /proc/cpuinfo ]; then
            grep -m1 'model name' /proc/cpuinfo
            grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(sse4_1|avx2|avx512f|avx512cd)$' || true
          else
            sysctl -n machdep.cpu.brand_string
            sysctl -n machdep.cpu.leaf7_features || true
          fi
      # The candidate kernels are asserted bit-exact before anything is timed,
      # so a number can never come from an arm that computes the wrong answer.
      - name: Assert the candidates against the scalar reference
        env:
          DYLD_FALLBACK_LIBRARY_PATH: /usr/lib/swift
        run: cargo test --release --lib recon_simd -- --nocapture
      # `ubuntu-latest` is drawn at random from several CPU models, and the
      # first three draws showed the answer depends on which one — so the model
      # is printed into the timing output itself, and the draws are grouped by
      # it rather than averaged across it.
      - name: Time the band-offset search
        env:
          # x86_64 macOS resolves `libswiftCore.dylib` through neither the
          # build's rpath nor the dyld cache; the Swift runtime lives here.
          DYLD_FALLBACK_LIBRARY_PATH: /usr/lib/swift
        run: |
          if [ -r /proc/cpuinfo ]; then
            echo "HOST-MODEL $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          else
            echo "HOST-MODEL $(sysctl -n machdep.cpu.brand_string)"
          fi
          cargo test --release --lib recon_simd::tests::bench_band_offset_row \
            -- --ignored --nocapture

  reconstruct-group:
    name: hevc_encode_640x352_reconstruct (draw ${{ matrix.draw }})
    strategy:
      fail-fast: false
      matrix:
        draw: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup show
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Report the host
        run: grep -m1 'model name' /proc/cpuinfo
      # The whole-picture effect is a branch-against-base comparison, so both
      # trees are built and run on the same host and interleaved within a round:
      # `ubuntu-latest` draws several CPU models, and they disagree by more than
      # this effect. The group's own scalar arm is the control - it resolves to
      # the same scalar reference in both trees, so it has to read 1.00x.
      - name: Check out the merge base alongside
        run: |
          git worktree add ../base "$(git merge-base HEAD origin/main)"
      - name: Build both benchmark binaries
        run: |
          cargo bench --features native --bench hevc_encode --no-run
          cd ../base && cargo bench --features native --bench hevc_encode --no-run
      - name: Run the reconstruction group, interleaved
        run: |
          set -o pipefail
          echo "HOST-MODEL $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)" \
            | tee reconstruct.log
          for round in 1 2 3; do
            for tree in head base; do
              case "$tree" in
                head) dir=. ;;
                base) dir=../base ;;
              esac
              echo "=== ROUND $round TREE $tree ===" >> "$GITHUB_WORKSPACE/reconstruct.log"
              ( cd "$dir" && cargo bench --features native --bench hevc_encode -- \
                  hevc_encode_640x352_reconstruct ) 2>&1 \
                | tee -a "$GITHUB_WORKSPACE/reconstruct.log"
            done
          done
      - name: Upload the log
        uses: actions/upload-artifact@v4
        with:
          name: reconstruct-draw-${{ matrix.draw }}
          path: reconstruct.log
          retention-days: 7
