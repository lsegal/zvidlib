# TEMPORARY diagnostic workflow for issue #336. Removed before that pull
# request is marked ready: it exists so a single AV1 kernel group can be
# re-timed on an x86_64 runner in minutes instead of dispatching the whole
# two-hour `Benchmarks` job.
name: Bench probe

on:
  workflow_dispatch:
    inputs:
      bench:
        description: 'Bench target'
        required: false
        default: 'av1_encode'
      filter:
        description: 'Criterion filter'
        required: false
        default: 'av1_forward_dct_16x16'
  pull_request:
    paths:
      - '.github/workflows/bench-probe.yml'
      - 'src/av1_simd/**'

permissions:
  contents: read

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Report the host
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 flags /proc/cpuinfo | tr ' ' '\n' | grep -E '^(sse4_1|avx2|avx512f)$' | sort -u
      - name: Probe
        env:
          ZVIDLIB_BENCH_LARGE: '1'
          BENCH: ${{ inputs.bench || 'av1_encode' }}
          FILTER: ${{ inputs.filter || 'av1_forward_dct_16x16|av1_forward_dct_32x32|av1_forward_flipadst_16x16' }}
        run: |
          set -o pipefail
          cargo bench --features native --bench "$BENCH" -- --sample-size 10 --warm-up-time 1 --measurement-time 3 "$FILTER" 2>&1 | tee probe.log
      - name: Summarize
        if: always()
        run: |
          {
            echo '## Probe'
            echo
            echo '```'
            grep -m1 'model name' /proc/cpuinfo
            grep -E '^\s+time:|^[A-Za-z0-9_]+/(scalar|sse4\.1|avx2|neon)|Mpx/s' probe.log || tail -40 probe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
