# TEMPORARY: measures the hevc::engine::simd x86_64 kernel ratios on an Intel
# host for issue #218. Deleted before that PR is marked ready for review.
name: Issue 218 Intel SIMD probe

on:
  push:
    branches: ['fix/issue-218-*']

permissions:
  contents: read

jobs:
  probe:
    name: Probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # The macOS 15 Intel image links the crate's apple-cf dependency against a
    # Swift runtime it does not stage next to the test binary, so add the
    # system Swift runtime directory to the binary's rpath.
    env:
      RUSTFLAGS: ${{ startsWith(matrix.os, 'macos') && '-C link-arg=-Wl,-rpath,/usr/lib/swift' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Identify the CPU
        shell: bash
        run: |
          uname -a
          sw_vers || true
          if [ -r /proc/cpuinfo ]; then
            grep -m1 'vendor_id\|model name' /proc/cpuinfo || true
          fi
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true
          sysctl -n machdep.cpu.vendor 2>/dev/null || true
          sysctl -n machdep.cpu.features machdep.cpu.leaf7_features 2>/dev/null || true
          ls /usr/lib/swift 2>/dev/null | head -5 || true
      - name: Install Rust toolchain
        run: rustup show
      - name: Inter-prediction kernel benchmark
        run: |
          for round in 1 2 3; do
            echo "=== inter-pred round $round ==="
            cargo test --release --features native --lib simd_inter_pred_benchmark -- --ignored --nocapture
          done
      - name: In-loop filter benchmark
        run: |
          for round in 1 2 3; do
            echo "=== in-loop round $round ==="
            cargo test --release --features native --lib bench_in_loop_filters -- --ignored --nocapture
          done
