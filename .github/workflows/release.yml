name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Package release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: '0.15.0'
        run: |
          target="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          mkdir -p "$RUNNER_TEMP/wasm-pack"
          curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${target}.tar.gz" \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/wasm-pack" "${target}/wasm-pack"
          echo "$RUNNER_TEMP/wasm-pack" >> "$GITHUB_PATH"
      - name: Verify package version matches the release tag
        run: |
          test "${TAG#v}" = "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          cargo metadata --no-deps --format-version 1 | jq -e '.packages[0] | (.license != null and .license != "") or (.license_file != null and .license_file != "")'
          test -n "$CARGO_REGISTRY_TOKEN"
        env:
          TAG: ${{ github.ref_name }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Build release assets
        run: |
          mkdir release
          cargo package --locked
          cp target/package/zvidlib-*.crate release/
          wasm-pack build --release --target web --out-dir pkg --no-default-features --features web
          (cd pkg && npm pack --pack-destination ../release)
          mv release/zvidlib-*.tgz "release/zvidlib-web-${{ github.ref_name }}.tgz"
          mv release "$RUNNER_TEMP/release"
          rm -rf pkg
      - name: Publish the Rust crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
      - name: Create the GitHub release with its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$RUNNER_TEMP"/release/* --verify-tag --title "zvidlib ${{ github.ref_name }}" --generate-notes
