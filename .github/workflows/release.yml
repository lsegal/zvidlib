name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Package release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: '0.15.0'
        run: |
          target="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          mkdir -p "$RUNNER_TEMP/wasm-pack"
          curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${target}.tar.gz" \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/wasm-pack" "${target}/wasm-pack"
          echo "$RUNNER_TEMP/wasm-pack" >> "$GITHUB_PATH"
      # Every workspace package is versioned in lockstep with `zvidlib` (#604),
      # so each one has to match the tag, not just the first one listed.
      - name: Verify every package version matches the release tag
        run: |
          mismatched="$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg version "${TAG#v}" '.packages[] | select(.version != $version) | .name')"
          if [ -n "$mismatched" ]; then
            echo "these packages are not at ${TAG#v}: $mismatched"
            exit 1
          fi
        env:
          TAG: ${{ github.ref_name }}
      - name: Build release assets
        run: |
          mkdir release
          # `zvidlib` and every crate it is built from, verified together so
          # each one builds against the others as they will be published.
          # The benchmark helpers are development-only and never published.
          cargo package --workspace --exclude zvidlib-bench-support --locked
          cp target/package/*.crate release/
          wasm-pack build --release --target web --out-dir pkg --features web
          (cd pkg && npm pack --pack-destination ../release)
          mv release/zvidlib-*.tgz "release/zvidlib-web-${{ github.ref_name }}.tgz"
      # `cargo publish --workspace` uploads the packages `cargo package` just
      # verified, in dependency order (#610). It runs before the GitHub release
      # is created so a re-run of a failed job repeats both: a package already
      # on crates.io at this version is left out rather than failing the
      # upload, so a re-run resumes after a partial publish. A tag pushed
      # before the token secret exists still gets its GitHub release.
      # `tests/ci_release_publishes_every_crate.rs` holds the excluded set to
      # the packages that declare `publish = false`.
      - name: Publish the crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not set, so no crate was published to crates.io."
            exit 0
          fi
          version="${TAG#v}"
          packages="$(cargo metadata --no-deps --format-version 1 \
            | jq -c '[.packages[] | select(.publish != [])]')"
          # crates.io refuses a package without a license, which would fail
          # the upload partway through the workspace.
          unlicensed="$(jq -r '.[] | select(.license == null and .license_file == null) | .name' <<<"$packages")"
          if [ -n "$unlicensed" ]; then
            echo "::error::these packages declare no license or license-file, which crates.io requires:"
            echo "$unlicensed"
            exit 1
          fi
          already=()
          for name in $(jq -r '.[].name' <<<"$packages"); do
            # The sparse index path of a name of four or more characters.
            status="$(curl -sS -o index.json -w '%{http_code}' \
              "https://index.crates.io/${name:0:2}/${name:2:2}/${name}")"
            if [ "$status" = 200 ] && jq -s -e --arg v "$version" 'any(.[]; .vers == $v)' index.json >/dev/null; then
              echo "$name $version is already on crates.io; not publishing it again"
              already+=(--exclude "$name")
            elif [ "$status" != 200 ] && [ "$status" != 404 ]; then
              echo "::error::the crates.io index answered $status for $name"
              exit 1
            fi
          done
          rm -f index.json
          if [ "$((${#already[@]} / 2))" = "$(jq length <<<"$packages")" ]; then
            echo "every crate is already on crates.io at $version"
            exit 0
          fi
          # The packages were verified by the step above, so this does not
          # build them again.
          cargo publish --workspace --exclude zvidlib-bench-support "${already[@]}" --locked --no-verify
      - name: Create the GitHub release with its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --verify-tag --title "zvidlib ${{ github.ref_name }}" --generate-notes
