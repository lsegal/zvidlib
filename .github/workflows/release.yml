name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Package release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: '0.15.0'
        run: |
          target="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          mkdir -p "$RUNNER_TEMP/wasm-pack"
          curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${target}.tar.gz" \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/wasm-pack" "${target}/wasm-pack"
          echo "$RUNNER_TEMP/wasm-pack" >> "$GITHUB_PATH"
      # Every workspace package is versioned in lockstep with `zvidlib` (#604),
      # so each one has to match the tag, not just the first one listed.
      - name: Verify every package version matches the release tag
        run: |
          mismatched="$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg version "${TAG#v}" '.packages[] | select(.version != $version) | .name')"
          if [ -n "$mismatched" ]; then
            echo "these packages are not at ${TAG#v}: $mismatched"
            exit 1
          fi
        env:
          TAG: ${{ github.ref_name }}
      - name: Build release assets
        run: |
          mkdir release
          # `zvidlib` and every crate it is built from, verified together so
          # each one builds against the others as they will be published.
          # The benchmark helpers are development-only and never published.
          cargo package --workspace --exclude zvidlib-bench-support --locked
          cp target/package/*.crate release/
          wasm-pack build --release --target web --out-dir pkg --no-default-features --features web
          (cd pkg && npm pack --pack-destination ../release)
          mv release/zvidlib-*.tgz "release/zvidlib-web-${{ github.ref_name }}.tgz"
      # `publish_crates.py` uploads every crate `cargo package` just verified,
      # one at a time in dependency order (#610), pacing them to crates.io's
      # rate limits and waiting out a 429 rather than failing (#637). It runs
      # before the GitHub release is created so a re-run of a failed job
      # repeats both: a crate already on crates.io at this version is skipped,
      # so a re-run resumes after a partial publish. A tag pushed before the
      # token secret exists still gets its GitHub release.
      - name: Publish the crates to crates.io
        # A first release of a dozen new crates waits about ten minutes
        # between uploads once crates.io's burst of five is spent.
        timeout-minutes: 240
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not set, so no crate was published to crates.io."
            exit 0
          fi
          python3 .github/scripts/publish_crates.py --version "${TAG#v}"
      - name: Create the GitHub release with its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --verify-tag --title "zvidlib ${{ github.ref_name }}" --generate-notes
