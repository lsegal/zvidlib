name: Intel probe (temporary, issue 285)

on:
  push:
    branches: ['fix/issue-285-**']

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        draw: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Report CPU
        run: |
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 'vendor_id' /proc/cpuinfo
          awk -F': ' '/^cpu family|^model\t|^model  |^stepping/ {print $0} /^stepping/ {exit}' /proc/cpuinfo
          grep -m1 flags /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx2|avx512f|sse4_1)$' | tr '\n' ' '; echo
          nproc
      - name: Install Rust toolchain
        run: rustup show
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build the benchmark
        run: cargo test --release --features native --lib simd_inter_pred_benchmark --no-run
      - name: Run the benchmark three times
        run: |
          for run in 1 2 3; do
            echo "=== run $run on $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs) ==="
            cargo test --release --features native --lib simd_inter_pred_benchmark -- --ignored --nocapture
          done
      - name: Backend bit-exactness
        run: cargo test --release --features native --lib every_backend_matches_scalar -- --nocapture
