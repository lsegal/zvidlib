# Temporary. Draws x86_64 hosts to attribute the §8.7.3 SAO band search's share
# of `hevc_encode_640x352_reconstruct` for #382, the way #340's `measure-334.yml`
# drew them for the band-offset kernel itself. Removed on that issue's branch
# once the numbers are recorded in `benches/README.md`.
name: Measure 382

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 'Interleaved rounds per host'
        required: false
        default: '5'
  pull_request:
    paths:
      - '.github/workflows/measure-382.yml'

permissions:
  contents: read

jobs:
  measure:
    name: Band-search share (${{ matrix.os }} draw ${{ matrix.draw }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        draw: [1, 2, 3, 4, 5, 6]
        include:
          - os: macos-15-intel
            draw: 1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: measure-382-${{ matrix.os }}
      - name: Install native audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Report the host CPU model
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            model="$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')"
          else
            model="$(sysctl -n machdep.cpu.brand_string)"
          fi
          echo "HOST_MODEL=$model" >> "$GITHUB_ENV"
          echo "# host cpu model: $model"
      - name: Compile the reconstruction groups
        run: cargo bench --features native --bench hevc_encode --no-run
      # One criterion process per round runs all four reconstruction groups
      # back to back — `_reconstruct` and `_reconstruct_no_band_search`, exact
      # and quantized — so the arms being subtracted are always timed within
      # the same round on the same host. The statistic is the per-id minimum
      # across rounds, which is what `benches/README.md` documents for a host
      # whose spread is larger than the effect.
      - name: Run the interleaved rounds
        run: |
          set -o pipefail
          rounds='${{ inputs.rounds || 5 }}'
          mkdir -p rounds
          for round in $(seq 1 "$rounds"); do
            cargo bench --features native --bench hevc_encode -- \
              'hevc_encode_640x352_reconstruct' 2>&1 | tee "rounds/round-$round.log"
            python3 .github/scripts/criterion_baseline.py collect \
              --criterion-dir target/criterion \
              --out "rounds/round-$round.json" \
              --commit "$GITHUB_SHA" \
              --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --host "$HOST_MODEL ($RUNNER_OS/$RUNNER_ARCH)"
          done
      - name: Report the band-search share
        run: python3 .github/scripts/band_search_share.py rounds "$HOST_MODEL" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the round logs
        uses: actions/upload-artifact@v4
        with:
          name: measure-382-${{ matrix.os }}-${{ matrix.draw }}
          path: rounds/
          retention-days: 7
