name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  # Timed benchmark runs are otherwise only triggered by a push to main; this
  # lets one be started by hand against any ref.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check native target
        run: cargo check --all-targets --features native
      - name: Lint native target
        run: cargo clippy --all-targets --features native -- -D warnings
      - name: Test AV1 SIMD kernels against the scalar path
        run: cargo test --features native --lib av1_simd -- --nocapture
      - name: Test library units
        run: cargo test --features native --lib
      - name: Test AV1 SIMD motion compensation
        run: cargo test --features native --lib av1_mc -- --nocapture
      - name: Test native_gl example overlays
        run: cargo test --features native --example native_gl
      # The HEVC/AV1 engine unit tests are pure numerics, and the inter-prediction
      # ones compare every SIMD backend the runner's CPU offers against the scalar
      # reference — which is how the x86_64 SSE4.1/AVX2 kernels get covered at all,
      # since the other CI hosts are aarch64.
      - name: Test HEVC/AV1 engine unit tests (including SIMD backends)
        run: "cargo test --features native --lib -- hevc::engine:: av1"
      - name: Check WebAssembly target
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features web
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build browser package
        run: wasm-pack build --target web --out-dir pkg --no-default-features --features web
      - name: Test in headless Chrome
        run: wasm-pack test --headless --chrome --no-default-features --features web

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading the previous successful main run's stored baseline artifact.
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Every PR compiles the bench target. Bench code that no longer builds is
      # the most common way a benchmark suite dies, and this catches it for the
      # price of a compile.
      - name: Compile benchmarks
        run: cargo bench --no-run --features native
      - name: Compile benchmarks (simd arm)
        run: cargo bench --no-run --features native,simd
      # Timings are measured on pushes to main and manual runs only. Shared
      # runners have a noise floor far above any threshold worth enforcing, so
      # gating PRs on them would produce false failures until the job was
      # disabled.
      - name: Run benchmarks
        if: github.event_name != 'pull_request'
        run: |
          cargo bench --features native --bench codec -- --noplot
          cargo bench --features native,simd --bench codec -- --noplot
      - name: Collect estimates
        if: github.event_name != 'pull_request'
        run: python3 .github/scripts/bench_delta.py collect --criterion-dir target/criterion --output bench-estimates.json
      # The previous successful main run's artifact is the baseline. A fresh
      # runner has no target/criterion tree, so criterion's own change detection
      # has nothing to compare against without this.
      - name: Download the previous main baseline
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch main --event push --status success --limit 10 \
              --json databaseId --jq '.[].databaseId'); do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" -n bench-baseline -D previous 2>/dev/null; then
              echo "baseline from run $run"
              break
            fi
          done
          test -f previous/bench-estimates.json || echo "no previous baseline found"
      - name: Report deltas
        if: github.event_name != 'pull_request'
        run: |
          python3 .github/scripts/bench_delta.py compare \
            --previous previous/bench-estimates.json \
            --current bench-estimates.json \
            --threshold 15 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Store this run as the next baseline
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline
          path: bench-estimates.json
          retention-days: 90

  native-platforms:
    name: Native checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Check native target
        run: cargo check --all-targets --features native
      - name: Test library units
        run: cargo test --features native --lib
      - name: Test accelerated HEVC selection and correctness
        run: cargo test --features native --test native_hevc_hardware -- --nocapture
      - name: Test AV1 SIMD motion compensation
        run: cargo test --features native --lib av1_mc -- --nocapture
