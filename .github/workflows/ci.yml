name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check native target
        run: cargo check --all-targets --features native
      - name: Lint native target
        run: cargo clippy --all-targets --features native -- -D warnings
      - name: Test native_gl example overlays
        run: cargo test --features native --example native_gl
      # The HEVC/AV1 engine unit tests are pure numerics, and the inter-prediction
      # ones compare every SIMD backend the runner's CPU offers against the scalar
      # reference — which is how the x86_64 SSE4.1/AVX2 kernels get covered at all,
      # since the other CI hosts are aarch64.
      - name: Test HEVC/AV1 engine unit tests (including SIMD backends)
        run: cargo test --features native --lib -- hevc::engine:: av1
      - name: Check WebAssembly target
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features web
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build browser package
        run: wasm-pack build --target web --out-dir pkg --no-default-features --features web
      - name: Test in headless Chrome
        run: wasm-pack test --headless --chrome --no-default-features --features web

  native-platforms:
    name: Native checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Check native target
        run: cargo check --all-targets --features native
      - name: Test accelerated HEVC selection and correctness
        run: cargo test --features native --test native_hevc_hardware -- --nocapture
