name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  # Timed runs are `main`-only, so this is the way to measure a branch on
  # demand without merging it first.
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Regression threshold, in percent, for the delta report'
        required: false
        default: '15'

permissions:
  contents: read

# Superseded pull-request runs are canceled, because the scarce resource here
# is the runner pool rather than the minutes: a run for a commit that has
# already been pushed over sits in the same queue as the run somebody is
# waiting on, and this repository pushes to a branch several times before it is
# reviewed. `main` pushes and `workflow_dispatch` runs are never canceled -
# the benchmark job's stored baseline is a chain, and a canceled link is a
# missing comparison for the run after it.
#
# The exemption is carried by the *group* rather than by `cancel-in-progress`,
# which is a literal here on purpose. `cancel-in-progress: ${{ ... }}` is
# substituted before it is read, so a `push` rendered the string `false` and
# every non-empty string is truthy: the flag meant to protect `main` was the
# thing canceling it, and only when two pushes landed close enough together to
# overlap, which is why it survived so long (#451). Instead, only a
# `pull_request` shares a group with anything - `github.ref` is
# `refs/pull/N/merge`, so a PR's runs supersede each other and no other PR's -
# while a `push` or a `workflow_dispatch` keys on `github.run_id` and is
# therefore alone in its group, where `cancel-in-progress` has nothing to act
# on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Neither cargo nor nextest can cache a test result, so a pull request that
  # touches nothing a job reads still paid for that job (#600). This decides
  # which of the jobs below a pull request has to run, from the files it
  # changes, and the others are skipped rather than failed: `Rust checks`,
  # `WebAssembly checks`, `Rust tests (<package>)`, `Native tests (<os>)` and
  # `macOS Swift runtime rpath`. The benchmark jobs are not gated; on a pull
  # request the only one is the compile check.
  #
  # It also decides which workspace packages a pull request can affect (#604),
  # and the test and benchmark jobs build and run only those. Every package has
  # a filter named after it that matches its own directory, the directory of
  # every workspace crate it depends on - through its dependencies,
  # build-dependencies and dev-dependencies, and theirs - and every file it
  # pulls in through `include_str!` or `include_bytes!` from anywhere else, so
  # a change to a crate selects that crate and everything that depends on it,
  # directly or transitively, and nothing else (#612). `packages` is the JSON
  # list of the filters that matched, or `all`; the jobs pick their package
  # names out of it. `crates` is the same selection as a JSON list of package
  # names only, `all` expanded, which is what the per-crate test matrix runs.
  #
  # Only a pull request is filtered. A `main` push and a `workflow_dispatch`
  # run everything, because the benchmark baseline is a chain and `main`'s
  # history is what a regression is bisected through; the filter step does not
  # even run there, and each output is `true` before it reads the step.
  #
  # The filters err towards running a job. `everything` is the build
  # definition - the manifest, the lockfile, the build script, the toolchain,
  # cargo's and nextest's configuration and this workflow - and any of those
  # runs every job and every package. Otherwise a job runs on every directory
  # it compiles or reads, and the only exclusions are modules its target does
  # not compile: the `cfg(not(target_arch = "wasm32"))` crates, modules and
  # platform backends for the WebAssembly checks, and the
  # `cfg(target_arch = "wasm32")` browser modules for the native jobs. With
  # `some-with-excludes` a file is matched by any pattern of a filter and
  # unmatched by any `!` pattern of it.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    # The pull-request file list comes from the API, so nothing is checked out.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.everything == 'true' || steps.filter.outputs.rust == 'true' }}
      wasm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.everything == 'true' || steps.filter.outputs.wasm == 'true' }}
      rust_tests: ${{ github.event_name != 'pull_request' || steps.filter.outputs.everything == 'true' || steps.filter.outputs.rust_tests == 'true' }}
      native_tests: ${{ github.event_name != 'pull_request' || steps.filter.outputs.everything == 'true' || steps.filter.outputs.native_tests == 'true' }}
      macos_swift_rpath: ${{ github.event_name != 'pull_request' || steps.filter.outputs.everything == 'true' || steps.filter.outputs.macos_swift_rpath == 'true' }}
      packages: ${{ (github.event_name != 'pull_request' || steps.filter.outputs.everything == 'true') && 'all' || steps.filter.outputs.changes }}
      crates: ${{ steps.crates.outputs.crates }}
    steps:
      - name: Match the changed files against each job's and package's inputs
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            everything:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.config/**'
              - '.github/workflows/ci.yml'
            # Formatting covers every Rust file, the browser modules included;
            # the lints cover every target; the scripts' tests, the SIMD
            # assembly check and the web example's Node tests run here too.
            rust:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'examples/**'
              - 'crates/**'
              - 'rustfmt.toml'
              - '.github/scripts/**'
            # `wasm-pack test` builds the library's units and the integration
            # tests for wasm32; the native-only examples are skipped by their
            # `required-features`, but a new example might not be. Only the
            # sources of a native-only crate are excluded, never its manifest:
            # its dependencies are still resolved for wasm32.
            wasm:
              - 'src/**'
              - 'tests/**'
              - 'crates/**'
              - 'examples/**/*.rs'
              - 'js/**'
              - '!crates/zvidlib-aac-encoder/src/**'
              - '!crates/zvidlib-hevc-encoder/src/**'
              - '!src/native_audio.rs'
              - '!src/native_audio/**'
              - '!crates/zvidlib-hardware/src/annexb.rs'
              - '!crates/zvidlib-hardware/src/nvdec.rs'
              - '!crates/zvidlib-hardware/src/planar.rs'
              - '!crates/zvidlib-hardware/src/readback.rs'
              - '!crates/zvidlib-hardware/src/videotoolbox.rs'
              - '!crates/zvidlib-hardware/src/videotoolbox_encoder.rs'
              - '!crates/zvidlib-hardware/src/videotoolbox_vp9.rs'
              - '!crates/zvidlib-hardware/src/windows_mf.rs'
              - '!crates/zvidlib-hardware/src/windows_mf_encoder.rs'
              - '!crates/zvidlib-hevc-decoder/src/decode_bench.rs'
            rust_tests:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'examples/**'
              - 'crates/**'
              - '!src/wasm_api.rs'
              - '!src/web_audio_decoder.rs'
              - '!src/web_decoder.rs'
              - '!src/web_encoder.rs'
              - '!src/web_previews.rs'
            native_tests:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'examples/**'
              - 'crates/**'
              - '!src/wasm_api.rs'
              - '!src/web_audio_decoder.rs'
              - '!src/web_decoder.rs'
              - '!src/web_encoder.rs'
              - '!src/web_previews.rs'
            # A release build of the library and the one test that inspects
            # what it links.
            macos_swift_rpath:
              - 'src/**'
              - 'crates/**'
              - 'tests/macos_swift_runtime_rpath.rs'
              - '!src/wasm_api.rs'
              - '!src/web_audio_decoder.rs'
              - '!src/web_decoder.rs'
              - '!src/web_encoder.rs'
              - '!src/web_previews.rs'
            # One filter per workspace package, named after it.
            zvidlib:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'examples/**'
              - 'crates/zvidlib-aac-encoder/**'
              - 'crates/zvidlib-av1/**'
              - 'crates/zvidlib-av1-decoder/**'
              - 'crates/zvidlib-av1-encoder/**'
              - 'crates/zvidlib-av1-syntax/**'
              - 'crates/zvidlib-bench-support/**'
              - 'crates/zvidlib-build/**'
              - 'crates/zvidlib-color/**'
              - 'crates/zvidlib-container/**'
              - 'crates/zvidlib-core/**'
              - 'crates/zvidlib-hardware/**'
              - 'crates/zvidlib-hevc/**'
              - 'crates/zvidlib-hevc-decoder/**'
              - 'crates/zvidlib-hevc-encoder/**'
              - 'crates/zvidlib-hevc-syntax/**'
              - 'crates/zvidlib-opus/**'
              - 'crates/zvidlib-opus-syntax/**'
              - 'crates/zvidlib-vorbis-decoder/**'
              - 'crates/zvidlib-vorbis-encoder/**'
              - 'crates/zvidlib-vorbis-syntax/**'
              - 'crates/zvidlib-vp8/**'
              - 'crates/zvidlib-vp9-decoder/**'
              - 'crates/zvidlib-vp9-encoder/**'
              - 'crates/zvidlib-vp9-syntax/**'
            zvidlib-aac-encoder:
              - 'crates/zvidlib-aac-encoder/**'
              - 'crates/zvidlib-core/**'
            zvidlib-av1:
              - 'crates/zvidlib-av1/**'
              - 'crates/zvidlib-av1-syntax/**'
              - 'crates/zvidlib-bench-support/**'
              - 'crates/zvidlib-color/**'
              - 'crates/zvidlib-container/**'
              - 'crates/zvidlib-core/**'
              - 'crates/zvidlib-opus-syntax/**'
              - 'crates/zvidlib-vorbis-syntax/**'
            zvidlib-av1-decoder:
              - 'crates/zvidlib-av1/**'
              - 'crates/zvidlib-av1-decoder/**'
              - 'crates/zvidlib-av1-encoder/**'
              - 'crates/zvidlib-av1-syntax/**'
              - 'crates/zvidlib-bench-support/**'
              - 'crates/zvidlib-color/**'
              - 'crates/zvidlib-container/**'
              - 'crates/zvidlib-core/**'
              - 'crates/zvidlib-opus-syntax/**'
              - 'crates/zvidlib-vorbis-syntax/**'
              - 'examples/media/**'
            zvidlib-av1-encoder:
              - 'crates/zvidlib-av1/**'
              - 'crates/zvidlib-av1-decoder/**'
              - 'crates/zvidlib-av1-encoder/**'
              - 'crates/zvidlib-av1-syntax/**'
              - 'crates/zvidlib-bench-support/**'
              - 'crates/zvidlib-color/**'
              - 'crates/zvidlib-container/**'
              - 'crates/zvidlib-core/**'
              - 'crates/zvidlib-opus-syntax/**'
              - 'crates/zvidlib-vorbis-syntax/**'
            zvidlib-av1-syntax:
              - 'crates/zvidlib-av1-syntax/**'
              - 'crates/zvidlib-core/**'
            zvidlib-bench-support:
              - 'crates/zvidlib-bench-support/**'
              - 'crates/zvidlib-core/**'
            zvidlib-build:
              - 'crates/zvidlib-build/**'
            zvidlib-color:
              - 'crates/zvidlib-color/**'
              - 'crates/zvidlib-core/**'
            zvidlib-container:
              - 'crates/zvidlib-av1-decoder/**'
              - 'crates/zvidlib-av1-syntax/**'
              - 'crates/zvidlib-color/**'
              - 'crates/zvidlib-container/**'
              - 'crates/zvidlib-core/**'
              - 'crates/zvidlib-opus-syntax/**'
              - 'crates/zvidlib-vorbis-syntax/**'
              - 'crates/zvidlib-vp9-decoder/tests/fixtures/vp9_bbb_256x144.mp4'
              - 'examples/media/**'
            zvidlib-core:
              - 'crates/zvidlib-core/**'
            zvidlib-hardware:
              - 'crates/zvidlib-av1-syntax/**'
              - 'crates/zvidlib-build/**'
              - 'crates/zvidlib-color/**'
              - 'crates/zvidlib-container/**'
              - 'crates/zvidlib-core/**'
              - 'crates/zvidlib-hardware/**'
              - 'crates/zvidlib-hevc/**'
              - 'crates/zvidlib-hevc-decoder/**'
              - 'crates/zvidlib-hevc-encoder/**'
              - 'crates/zvidlib-hevc-syntax/**'
              - 'crates/zvidlib-opus-syntax/**'
              - 'crates/zvidlib-vorbis-syntax/**'
              - 'crates/zvidlib-vp9-decoder/**'
              - 'crates/zvidlib-vp9-syntax/**'
            zvidlib-hevc:
              - 'crates/zvidlib-core/**'
              - 'crates/zvidlib-hevc/**'
              - 'crates/zvidlib-hevc-syntax/**'
            zvidlib-hevc-decoder:
              - 'crates/zvidlib-av1-syntax/**'
              - 'crates/zvidlib-bench-support/**'
              - 'crates/zvidlib-build/**'
              - 'crates/zvidlib-color/**'
              - 'crates/zvidlib-container/**'
              - 'crates/zvidlib-core/**'
              - 'crates/zvidlib-hardware/**'
              - 'crates/zvidlib-hevc/**'
              - 'crates/zvidlib-hevc-decoder/**'
              - 'crates/zvidlib-hevc-encoder/**'
              - 'crates/zvidlib-hevc-syntax/**'
              - 'crates/zvidlib-opus-syntax/**'
              - 'crates/zvidlib-vorbis-syntax/**'
              - 'crates/zvidlib-vp9-syntax/**'
              - 'examples/media/**'
            zvidlib-hevc-encoder:
              - 'crates/zvidlib-av1-syntax/**'
              - 'crates/zvidlib-bench-support/**'
              - 'crates/zvidlib-build/**'
              - 'crates/zvidlib-color/**'
              - 'crates/zvidlib-container/**'
              - 'crates/zvidlib-core/**'
              - 'crates/zvidlib-hardware/**'
              - 'crates/zvidlib-hevc/**'
              - 'crates/zvidlib-hevc-decoder/**'
              - 'crates/zvidlib-hevc-encoder/**'
              - 'crates/zvidlib-hevc-syntax/**'
              - 'crates/zvidlib-opus-syntax/**'
              - 'crates/zvidlib-vorbis-syntax/**'
