              - 'crates/zvidlib-vorbis-syntax/**'
            zvidlib-vorbis-encoder:
              - 'crates/zvidlib-av1-syntax/**'
              - 'crates/zvidlib-bench-support/**'
              - 'crates/zvidlib-container/**'
              - 'crates/zvidlib-core/**'
              - 'crates/zvidlib-opus-syntax/**'
              - 'crates/zvidlib-vorbis-decoder/**'
              - 'crates/zvidlib-vorbis-encoder/**'
