name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  # Timed runs are `main`-only, so this is the way to measure a branch on
  # demand without merging it first.
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Regression threshold, in percent, for the delta report'
        required: false
        default: '15'

permissions:
  contents: read

# Superseded pull-request runs are cancelled, because the scarce resource here
# is the runner pool rather than the minutes: a run for a commit that has
# already been pushed over sits in the same queue as the run somebody is
# waiting on, and this repository pushes to a branch several times before it is
# reviewed. `main` pushes and `workflow_dispatch` runs are never cancelled -
# the benchmark job's stored baseline is a chain, and a cancelled link is a
# missing comparison for the run after it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      # This job rebuilt every dependency from a cold `target/` on every run
      # before this step existed (#352). The cache is keyed on the job, the
      # runner, the toolchain and the manifest, so the `[profile.bench]`
      # fat-LTO artifacts and the `[profile.dev]` ones never share an entry;
      # `cache-on-failure` keeps a failed run's dependency build, since the
      # dependencies are not what failed.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check native target
        run: cargo check --all-targets --features native
      - name: Lint native target
        run: cargo clippy --all-targets --features native -- -D warnings
      # The checks above only cover files some target actually compiles, so an
      # undeclared file under benches/ passes them by being skipped. This asserts
      # every one of them is reachable from a [[bench]] target.
      - name: Check every bench source is compiled
        run: cargo test --features native --test bench_sources_compile
      # Criterion keys a group by its name alone, so two targets claiming one
      # name overwrite each other under target/criterion/ and a collected
      # baseline sees whichever ran second. That is silent in a bench log and
      # only surfaces as a committed table row that moved for no reason a commit
      # explains, which is what issue #414 turned out to be.
      - name: Check no two bench targets claim one criterion group
        run: cargo test --features native --test bench_group_names_are_unique
      # The caching this workflow depends on is opt-in per job, so a job added
      # without it is slow in a way nothing else here would report.
      - name: Check every cargo CI job is cached
        run: cargo test --features native --test ci_workflows_cache_cargo
      # `criterion_baseline.py` is where a benchmark regression threshold is
      # justified from, and it runs in a job that takes two hours to reach it.
      # Standard library only, so this needs no install step. Its `table`
      # subcommand is covered here too: that path's failure mode is a plausible
      # table with a column silently missing rather than a crash - the arm name
      # it matched drifted from the one `SimdIsa` prints and every SSE4.1
      # measurement was dropped - and nothing else in CI executes it.
      - name: Test the benchmark baseline script
        run: python3 -m unittest discover -s .github/scripts -v
      # The staleness report used to run here and is now `baseline-staleness.yml`:
      # its whole input is `benches/README.md`, and the `paths-ignore` above
      # meant the changes that edit that file were exactly the changes that
      # skipped it (#449). The unit tests of the script it runs stay here,
      # since those depend on the script rather than on the tables.
      - name: Test AV1 SIMD kernels against the scalar path
        run: cargo test --features native --lib av1_simd -- --nocapture
      # The kernels being bit-exact is not the same as their being fast, and
      # `--lib av1_simd` above only proves the first. `#[target_feature]` widens
      # the function it is written on and nothing it calls, so an `av1_simd`
      # kernel the inliner declines to absorb into its wrapper is compiled at
      # the baseline instruction set and runs several times slower than the
      # scalar code it replaces, with every test still passing (#336). This
      # greps that out of the emitted assembly. One x86_64 host is enough and
      # this job is one: on the matrix's aarch64 macOS runner NEON is in the
      # baseline, so a kernel that lost its attribute still compiles to NEON and
      # leaves no trace, and `macos-15-intel` would only repeat what runs here.
      - name: Check the SIMD kernels kept their target feature
        run: python3 .github/scripts/check_simd_target_features.py build
      - name: Test library units
        run: cargo test --features native --lib
      - name: Test AV1 SIMD motion compensation
        run: cargo test --features native --lib av1_mc -- --nocapture
      # `--release` is the profile #327 was reported against: nothing about the
      # missing rpath is profile-specific, but this is the invocation the issue
      # names and the one the Intel benchmark column is measured with, so it is
      # the one worth asserting launches unaided. `cargo build` first so the
      # shipped cdylib exists for the rpath test to check as well - `cargo test`
      # alone links the library as an rlib and never produces it. Neither step
      # sets a `DYLD_*` variable, which is the point.
      - name: Test the macOS Swift runtime rpath
        if: runner.os == 'macOS'
        run: |
          cargo build --release --features native
          cargo test --release --features native --test macos_swift_runtime_rpath -- --nocapture
          cargo test --release --features native --lib
      - name: Test native_gl example overlays
        run: cargo test --features native --example native_gl
      # The web example makes the same scrubbing decisions `native_gl` does - the random-access
      # restart, the measured stride, the walk's next step - and its copy of them had nothing
      # asserting it (#380). Node's built-in runner, so this needs no install step and no
      # dependency the example does not already have.
      - name: Test the web example's scrub walk
        run: node --test examples/web_canvas/scrub.test.js
      # The HEVC/AV1 engine unit tests are pure numerics, and the inter-prediction
      # ones compare every SIMD backend the runner's CPU offers against the scalar
      # reference — which is how the x86_64 SSE4.1/AVX2 kernels get covered at all,
      # since the other CI hosts are aarch64.
      - name: Test HEVC/AV1 engine unit tests (including SIMD backends)
        run: "cargo test --features native --lib -- hevc::engine:: av1"
      - name: Check WebAssembly target
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features web
      # The published musl binary rather than `cargo install wasm-pack`, which
      # compiled the tool and its dependency tree from source on every run for
      # a build that is not this crate's. The version is still pinned, and the
      # download is a release asset of the same tag `--version` named.
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: '0.15.0'
        run: |
          target="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          mkdir -p "$RUNNER_TEMP/wasm-pack"
          curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${target}.tar.gz" \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/wasm-pack" "${target}/wasm-pack"
          "$RUNNER_TEMP/wasm-pack/wasm-pack" --version
          echo "$RUNNER_TEMP/wasm-pack" >> "$GITHUB_PATH"
      - name: Build browser package
        run: wasm-pack build --target web --out-dir pkg --no-default-features --features web
      - name: Test in headless Chrome
        run: wasm-pack test --headless --chrome --no-default-features --features web

  # Benchmarks are measured, not gated. On a pull request this job only compiles
  # the suite: `cargo bench --no-run` costs one build and catches bench-code
  # rot, which is how benchmark suites usually die - the code stops compiling
  # against the crate and nobody notices for months. It deliberately does not
  # time anything on a pull request. GitHub's shared runners vary by an order of
  # magnitude more than the regressions worth catching, so a PR gate on those
  # timings would fail on noise until someone disabled it.
  #
  # Timed runs happen on `main` pushes and `workflow_dispatch`, where successive
  # runs are comparable enough to be worth storing: each one saves a baseline
  # artifact and reports its deltas against the previous one in the job summary.
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    # `actions: read` is for listing and downloading the previous run's baseline
    # artifact through the API; `actions/download-artifact` only reaches within
    # a single run.
    permissions:
      contents: read
      actions: read
    # `[profile.bench]` is `lto = "fat"` with `codegen-units = 1`, so the build
    # alone is slow, and the timed run adds one arm per available instruction
    # set on top of it.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      # This job rebuilt every dependency from a cold `target/` on every run
      # before this step existed (#352). The cache is keyed on the job, the
      # runner, the toolchain and the manifest, so the `[profile.bench]`
      # fat-LTO artifacts and the `[profile.dev]` ones never share an entry;
      # `cache-on-failure` keeps a failed run's dependency build, since the
      # dependencies are not what failed.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Every `[[bench]]` target, not one of them: the suite is nine targets
      # (`codec`, `av1_decode`, `av1_encode`, `hevc_decode`, `hevc_encode`,
      # `audio_decode`, `audio_mux`, `hevc_hardware`, `exact_seek`) and naming
      # one would let the other eight rot unnoticed, which is the exact failure
      # this step exists to catch.
      - name: Compile the benchmark suite
        run: cargo bench --features native --benches --no-run

      - name: Run the benchmarks
        if: github.event_name != 'pull_request'
        env:
          # The whole-frame 1080p groups are the ones that prove the
          # crate-wide SIMD override reaches the HEVC kernels on real decode
          # work. They are opt-in because they are slow, which matters in an
          # edit loop and not here.
          ZVIDLIB_BENCH_LARGE: '1'
        # `tee` would otherwise swallow a panicking benchmark's exit status;
        # Actions runs `run:` under `bash -e` without pipefail.
        run: |
          set -o pipefail
          cargo bench --features native --benches 2>&1 | tee bench.log

      # `bench_across_isas` runs one arm per entry in `zvidlib::simd::available()`,
      # so a runner without AVX2 has no `avx2` arm rather than reporting scalar
      # numbers under a vector label. Surfacing the list makes a baseline
      # attributable to a host: an arm that vanished because the runner pool
      # changed looks exactly like an arm that never existed.
      - name: Report the host's instruction sets
        if: github.event_name != 'pull_request'
        run: |
          {
            echo '## Benchmark host'
            echo
            echo '```'
            # `ubuntu-latest` is a pool of several CPU models, and an
            # elementwise minimum taken across two of them is attributable to
            # no named host. `benches/README.md` names the model each committed
            # table was measured on, so the model has to be in the run's own
            # record rather than reconstructed afterwards.
            echo "# host cpu model: $(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')"
            grep -hE '^# (host instruction sets|widest detected|dispatch site)' bench.log \
              | sort -u || echo 'no instruction-set log found in the benchmark output'
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect this run's baseline
        if: github.event_name != 'pull_request'
        run: |
          python3 .github/scripts/criterion_baseline.py collect \
            --criterion-dir target/criterion \
            --out baseline/criterion-baseline.json \
            --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --host "$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs) ($RUNNER_OS/$RUNNER_ARCH)"

      # The newest non-expired baseline uploaded by a `main` run. Absent on the
      # very first run, and after the 90-day retention window lapses; the
      # comparison step reports "no previous baseline" rather than failing.
      - name: Download the previous main baseline
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=criterion-baseline-main&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false) | select(.workflow_run.head_branch == "main")][0].id')"
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "no previous baseline artifact; this run establishes one"
            exit 0
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > previous.zip; then
            echo "could not download baseline artifact $id; reporting without a comparison"
            rm -f previous.zip
            exit 0
          fi
          unzip -o -j previous.zip -d previous

      - name: Compare against the previous baseline
        if: github.event_name != 'pull_request'
        run: |
          python3 .github/scripts/criterion_baseline.py compare \
            --previous previous/criterion-baseline.json \
            --current baseline/criterion-baseline.json \
            --threshold '${{ inputs.threshold || 15 }}' \
            --out delta.md
          cat delta.md >> "$GITHUB_STEP_SUMMARY"

      # `push` only, not `workflow_dispatch`: the stored chain is meant to be
      # successive states of `main`, and a dispatch can run on any branch. A
      # dispatch still gets its delta report, it just does not become the
      # baseline the next `main` run is measured against.
      - name: Upload this run's baseline
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: criterion-baseline-main
          path: baseline/criterion-baseline.json
          retention-days: 90

      # This one is per-run rather than a chain, so it carries the collected
      # baseline too. A `workflow_dispatch` run deliberately does not become the
      # stored `main` baseline above, and without a copy here its numbers would
      # be unrecoverable off the runner - which is exactly what refreshing the
      # committed table in `benches/README.md` needs from a dispatched run.
      - name: Upload the full benchmark log
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report-${{ github.run_id }}
          path: |
            bench.log
            baseline/criterion-baseline.json
            target/criterion/**/new/estimates.json
          retention-days: 30

  native-platforms:
    name: Native checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # `macos-latest` is aarch64, and Apple silicon's dyld shared cache
        # resolves the Swift runtime the `apple-cf` bridge references whether or
        # not the binary carries an rpath for it. x86_64 macOS does not, so a
        # missing rpath is a launch failure there and invisible here (#327);
        # `macos-15-intel` is what makes that arm covered rather than only ever
        # reached by hand when someone measures the Intel benchmark column.
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      # This job rebuilt every dependency from a cold `target/` on every run
      # before this step existed (#352). The cache is keyed on the job, the
      # runner, the toolchain and the manifest, so the `[profile.bench]`
      # fat-LTO artifacts and the `[profile.dev]` ones never share an entry;
      # `cache-on-failure` keeps a failed run's dependency build, since the
      # dependencies are not what failed.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check native target
        run: cargo check --all-targets --features native
      # The `cfg(windows)` half of the tree - `src/hevc/windows_mf.rs`, the
      # Windows arm of `src/hevc/nvdec.rs`, and the `windows` crate feature
      # list - only ever compiles here, so linting it anywhere else is
      # impossible. Same `-D warnings` gate the Linux job uses, so a
      # platform-specific warning fails the build rather than waiting for
      # someone to build on that platform by hand.
      - name: Lint native target
        run: cargo clippy --all-targets --features native -- -D warnings
      - name: Test library units
        run: cargo test --features native --lib
      - name: Test accelerated HEVC selection and correctness
        run: cargo test --features native --test native_hevc_hardware -- --nocapture
      - name: Test AV1 SIMD motion compensation
        run: cargo test --features native --lib av1_mc -- --nocapture
      # `--release` is the profile #327 was reported against: nothing about the
      # missing rpath is profile-specific, but this is the invocation the issue
      # names and the one the Intel benchmark column is measured with, so it is
      # the one worth asserting launches unaided. `cargo build` first so the
      # shipped cdylib exists for the rpath test to check as well - `cargo test`
      # alone links the library as an rlib and never produces it. Neither step
      # sets a `DYLD_*` variable, which is the point.
      - name: Test the macOS Swift runtime rpath
        if: runner.os == 'macOS'
        run: |
          cargo build --release --features native
          cargo test --release --features native --test macos_swift_runtime_rpath -- --nocapture
          cargo test --release --features native --lib
