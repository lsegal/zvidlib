name: Measure 440

# Temporary: takes the issue #440 second-host reading of the 16-bit
# interpolation path on x86_64 runners. Removed before this branch merges.
on:
  push:
    branches: [fix/issue-440-narrow-width-threshold]

permissions:
  contents: read

jobs:
  measure:
    name: measure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      # `ci_workflows_cache_cargo` requires this of every cargo job, and a
      # repeated draw wants it anyway: `[profile.release]` is fat LTO with one
      # codegen unit, so an uncached job spends eight minutes building before
      # it measures anything.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Identify the host
        run: |
          uname -a
          if [ "$RUNNER_OS" = "Linux" ]; then
            grep -m1 'model name' /proc/cpuinfo || true
            nproc
            grep -m1 flags /proc/cpuinfo | tr ' ' '\n' | grep -E '^(sse4_1|sse4_2|avx|avx2|avx512f)$' | sort -u | tr '\n' ' '
            echo
          else
            sysctl -n machdep.cpu.brand_string
            sysctl -n hw.ncpu
            sysctl -n machdep.cpu.leaf7_features
          fi
      - name: Install native audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build the measurement
        run: cargo test --release --features native --lib measure_narrow_vs_wide_block --no-run
      - name: Measure, three consecutive invocations
        run: |
          for i in 1 2 3; do
            echo "=== invocation $i on ${{ matrix.os }} ==="
            cargo test --release --features native --lib measure_narrow_vs_wide_block -- --ignored --nocapture
          done
