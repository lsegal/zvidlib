# Temporary, for issue #414 only. Removed before this branch merges.
#
# #414 asks why `av1_deblock`'s `scalar` arm is 25% slower between the two
# committed x86_64 table stamps. Bisecting that with the committed recipe is
# not possible directly: a round is attributable only to the CPU model it
# landed on, `ubuntu-latest` is a pool of models, and a bisect needs every step
# comparable to every other one.
#
# So each job here measures *two* commits on its own runner -- the older stamp's
# base and one candidate -- and reports the ratio between them. A ratio taken
# within one job is immune to which model the job landed on, which is what makes
# the steps comparable without dispatching a lottery per step. Two worktrees
# with their own target directories let the two builds be run alternately, so a
# drifting host affects both arms equally; the reported figure is the minimum of
# three interleaved passes per arm.
name: Bench deblock bisect (#414)

on:
  workflow_dispatch:
  # Temporary. `workflow_dispatch` does not resolve for a workflow that has
  # never run on the branch, and this workflow is not on `main`; the
  # pull_request trigger registers it. Every job below is dispatch-only.
  pull_request:

permissions:
  contents: read

env:
  # The #337 merge, which is what the older stamp `b284c38a6391` is plus a
  # temporary workflow that touches no crate code.
  BASE_SHA: b233f0a74f88c9f347900eae75a598919602279c

jobs:
  step:
    name: ${{ matrix.label }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: '04-351'
            sha: 0532d07fd94b0a5e5d4b1b8886a0bd398b552b38
          - label: '08-364'
            sha: a59d7d08e82a14b7bb76546de52ae43f57ce1d92
          - label: '09-348'
            sha: 76ef43259b89e72db26a92c9af8f510502d4aa3b
          - label: '12-365'
            sha: 42684b925a26d9d5e073ab4f413ec2088a533875
          - label: '16-345'
            sha: d61135d93f9b37c8469a67e0923e7392f64513f2
          - label: '20-389'
            sha: a21a6f0693bda9bfb105ac62e57cca1e4c162cbc
          - label: '24-392'
            sha: db8d0ad982331f302666b26234e30752cb58842f
          - label: '28-399'
            sha: 28c9c5d822b4ed5517a521c974a164c1212c5493
          - label: '32-407'
            sha: 605f9a43a24c3de20156bd27abdf49241a2c4d7a
    # Two fat-LTO builds plus six filtered bench passes.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup show && rustc --version
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Report the host
        run: |
          echo "# host cpu model: $(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
      - name: Lay out the two worktrees
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/cand" "${{ matrix.sha }}"
      - name: Build both arms
        run: |
          set -euo pipefail
          for arm in base cand; do
            (cd "$RUNNER_TEMP/$arm" && cargo bench --features native --bench av1_decode --no-run)
          done
      # Alternating passes, so a host that drifts mid-job drifts under both
      # arms rather than under one of them.
      - name: Measure the scalar arm, interleaved
        env:
          ZVIDLIB_BENCH_LARGE: '1'
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            for arm in base cand; do
              (cd "$RUNNER_TEMP/$arm" \
                && cargo bench --features native --bench av1_decode -- 'av1_deblock/scalar') \
                | tee -a "$RUNNER_TEMP/$arm.log"
            done
          done
      - name: Report the ratio
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, re
          UNIT = {'ns': 1e-6, 'us': 1e-3, 'µs': 1e-3, 'ms': 1.0, 's': 1000.0}
          def best(path):
              text = open(path, encoding='utf-8', errors='replace').read()
              hits = re.findall(
                  r'av1_deblock/scalar\s+time:\s+\[\S+ \S+ ([\d.]+) (\S+) ', text)
              return min(float(v) * UNIT[u] for v, u in hits) if hits else None
          tmp = os.environ['RUNNER_TEMP']
          base, cand = best(f'{tmp}/base.log'), best(f'{tmp}/cand.log')
          label, sha = '${{ matrix.label }}', '${{ matrix.sha }}'
          ratio = f'{cand / base:.3f}x' if base and cand else 'n/a'
          print(f'| `{label}` | `{sha[:12]}` | {base} ms | {cand} ms | {ratio} |')
          PY
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deblock-bisect-414-${{ matrix.label }}
          path: ${{ runner.temp }}/*.log
          retention-days: 30
