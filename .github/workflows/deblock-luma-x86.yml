# Temporary: draws the `av1_deblock_luma` row the x86_64 committed baseline
# table in `benches/README.md` has never had (issue #445). Deleted before the
# pull request that carries the row is merged; it exists so the run URL that
# measured the row is citable from the table.
#
# `benches/codec.rs` is run alone and into a `CRITERION_HOME` of its own, so
# nothing can overwrite its group the way `benches/av1_decode.rs` did in every
# round of the two committed x86_64 draws. `av1_decode.rs`'s `av1_deblock` is
# re-measured in the same session, into a second `CRITERION_HOME`, as the
# control that puts the two sides of the collision next to each other on
# `sse4.1` and `avx2`.
name: Deblock luma x86_64 draw

on:
  workflow_dispatch:
    inputs:
      runs:
        description: >-
          Space-separated run IDs of earlier `draw` runs to merge. Leave empty
          to draw a new round instead of merging.
        required: false
        default: ""
      model:
        description: The CPU model every merged run must have landed on.
        required: false
        default: AMD EPYC 7763 64-Core Processor
  # Temporary, and only so GitHub registers `workflow_dispatch` for a workflow
  # that exists on this branch alone. The job itself never runs on a pull
  # request; see the `if:` below.
  pull_request:

permissions:
  contents: read

jobs:
  draw:
    name: Draw av1_deblock_luma
    if: github.event_name == 'workflow_dispatch' && inputs.runs == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # The model is checked before the round is used: `ubuntu-latest` is a pool
      # and an elementwise minimum across two models is attributable to no named
      # host. Recorded here rather than reconstructed afterwards.
      - name: Report the host CPU model
        run: |
          {
            echo '## Benchmark host'
            echo
            echo '```'
            echo "# host cpu model: $(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > host.txt
          grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//' > model.txt

      - name: Compile the two bench targets
        run: cargo bench --features native --bench codec --bench av1_decode --no-run

      - name: Draw three rounds
        run: |
          set -o pipefail
          for round in 1 2 3; do
            CRITERION_HOME="$PWD/crit-luma-$round" \
              cargo bench --features native --bench codec -- '^av1_deblock_luma/' 2>&1 \
              | tee -a "bench-$round.log"
            CRITERION_HOME="$PWD/crit-ctrl-$round" \
              cargo bench --features native --bench av1_decode -- '^av1_deblock/' 2>&1 \
              | tee -a "bench-$round.log"
            python3 .github/scripts/criterion_baseline.py collect \
              --criterion-dir "crit-luma-$round" --out "luma-$round.json" \
              --commit "$GITHUB_SHA" \
              --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --host "$(cat model.txt) ($RUNNER_OS/$RUNNER_ARCH)"
            python3 .github/scripts/criterion_baseline.py collect \
              --criterion-dir "crit-ctrl-$round" --out "ctrl-$round.json" \
              --commit "$GITHUB_SHA" \
              --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --host "$(cat model.txt) ($RUNNER_OS/$RUNNER_ARCH)"
          done

      - name: Render both tables
        run: |
          {
            echo '## Draw'
            echo
            echo '### `av1_deblock_luma` (benches/codec.rs, three rounds)'
            echo
            python3 .github/scripts/criterion_baseline.py table \
              --baseline luma-1.json luma-2.json luma-3.json \
              --host "$(cat model.txt) (Linux, x86_64)"
            echo
            echo '### `av1_deblock` control (benches/av1_decode.rs, same session)'
            echo
            python3 .github/scripts/criterion_baseline.py table \
              --baseline ctrl-1.json ctrl-2.json ctrl-3.json \
              --host "$(cat model.txt) (Linux, x86_64)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the draw
        uses: actions/upload-artifact@v4
        with:
          name: deblock-luma-draw
          path: |
            luma-*.json
            ctrl-*.json
            bench-*.log
            host.txt
          retention-days: 7

  # Renders the committed row with `criterion_baseline.py table` itself, over
  # every round from the runs that landed on the CPU model the x86_64 table
  # names. Separate from `draw` because which runs those are is only knowable
  # after the dispatched rounds report their host, and because merging measures
  # nothing and so must not compete with a benchmark for a runner.
  merge:
    name: Merge the selected rounds
    if: github.event_name == 'workflow_dispatch' && inputs.runs != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      # The model check is the selection, restated where it is acted on: a
      # merge across two models is the elementwise minimum this recipe exists
      # to avoid, so a run that did not land on the named model fails the job
      # rather than being quietly folded in.
      - name: Download the selected runs and check each one's host
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          for run in $RUNS; do
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --dir "selected/$run"
            model=$(sed -n 's/^# host cpu model: //p' "selected/$run/deblock-luma-draw/host.txt")
            echo "run $run landed on: $model"
            if [ "$model" != "$MODEL" ]; then
              echo "::error::run $run landed on '$model', not '$MODEL'"
              exit 1
            fi
          done

      - name: Render the merged tables
        env:
          MODEL: ${{ inputs.model }}
          RUNS: ${{ inputs.runs }}
        run: |
          set -euo pipefail
          {
            echo "## Merged draw on $MODEL"
            echo
            echo "Runs merged: \`$RUNS\` — $(ls selected/*/deblock-luma-draw/luma-*.json | wc -l) rounds."
            echo
            echo '### `av1_deblock_luma` (benches/codec.rs, drawn alone)'
            echo
            python3 .github/scripts/criterion_baseline.py table \
              --baseline selected/*/deblock-luma-draw/luma-*.json \
              --host "$MODEL (Linux, x86_64)"
            echo
            echo '### `av1_deblock` control (benches/av1_decode.rs, same sessions)'
            echo
            python3 .github/scripts/criterion_baseline.py table \
              --baseline selected/*/deblock-luma-draw/ctrl-*.json \
              --host "$MODEL (Linux, x86_64)"
          } >> "$GITHUB_STEP_SUMMARY"
