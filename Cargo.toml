# The library is split into a workspace of codec, container and shared-core
# crates (#604) so a change to one codec recompiles, tests and benchmarks only
# that codec and what depends on it. `zvidlib` is still the only crate a user
# depends on: it re-exports the subcrates' public items under the paths they
# always had. Every library crate here is published alongside it, at the same
# version, which is why each workspace dependency below pins the version
# exactly as well as the path.
[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
license = "MIT"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/lsegal/zvidlib"
keywords = ["video", "audio", "webassembly", "webgl", "mp4"]
categories = ["multimedia", "wasm"]

[workspace.dependencies]
zvidlib-build = { path = "crates/zvidlib-build", version = "=0.3.0" }
zvidlib-core = { path = "crates/zvidlib-core", version = "=0.3.0" }
zvidlib-color = { path = "crates/zvidlib-color", version = "=0.3.0" }
zvidlib-av1-syntax = { path = "crates/zvidlib-av1-syntax", version = "=0.3.0" }
zvidlib-av1 = { path = "crates/zvidlib-av1", version = "=0.3.0" }
zvidlib-av1-decoder = { path = "crates/zvidlib-av1-decoder", version = "=0.3.0" }
zvidlib-av1-encoder = { path = "crates/zvidlib-av1-encoder", version = "=0.3.0" }
zvidlib-vp9-syntax = { path = "crates/zvidlib-vp9-syntax", version = "=0.3.0" }
zvidlib-hevc-syntax = { path = "crates/zvidlib-hevc-syntax", version = "=0.3.0" }
zvidlib-hardware = { path = "crates/zvidlib-hardware", version = "=0.3.0" }
zvidlib-vp8 = { path = "crates/zvidlib-vp8", version = "=0.3.0" }
zvidlib-vp9-decoder = { path = "crates/zvidlib-vp9-decoder", version = "=0.3.0" }
zvidlib-vp9-encoder = { path = "crates/zvidlib-vp9-encoder", version = "=0.3.0" }
zvidlib-hevc-decoder = { path = "crates/zvidlib-hevc-decoder", version = "=0.3.0" }
zvidlib-hevc-encoder = { path = "crates/zvidlib-hevc-encoder", version = "=0.3.0" }
zvidlib-opus = { path = "crates/zvidlib-opus", version = "=0.3.0" }
zvidlib-vorbis-decoder = { path = "crates/zvidlib-vorbis-decoder", version = "=0.3.0" }
zvidlib-vorbis-encoder = { path = "crates/zvidlib-vorbis-encoder", version = "=0.3.0" }
zvidlib-aac-encoder = { path = "crates/zvidlib-aac-encoder", version = "=0.3.0" }
zvidlib-container = { path = "crates/zvidlib-container", version = "=0.3.0" }

criterion = { version = "0.7", features = ["html_reports"] }
opus-pure = "0.2.2"
symphonia-core = "0.5.5"
libloading = "0.8.9"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
apple-cf = { version = "0.9.3", default-features = false, features = ["cm", "cv"] }
videotoolbox = { version = "0.18.1", default-features = false, features = ["decompression"] }

[package]
name = "zvidlib"
description = "Frame-accurate video and audio I/O for native and WebAssembly applications"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
# Integration fixtures and browser demo videos are not needed to build the
# published crate. Keep the MP4 sample used by the library's inline tests.
exclude = ["/tests", "/examples/media/BigBuckBunny.av1.mp4", "/examples/web_canvas/*.mp4"]

[lib]
crate-type = ["rlib", "cdylib"]

[[example]]
name = "native_gl"
path = "examples/native_gl/main.rs"
required-features = ["native"]
# The example's bitmap-font overlay helpers carry unit tests; `test = true` lets
# `cargo test --features native --example native_gl` run them.
test = true

# The HEVC decoder and its stage profiler are `cfg(not(target_arch = "wasm32"))`,
# and the wasm test job builds every example, so this one is gated behind
# `native` exactly as `native_gl` is. The feature gates no code of its own; it is
# only what keeps a wasm build from trying to compile a native-only target.
[[example]]
name = "hevc_decode_profile"
path = "examples/hevc_decode_profile.rs"
required-features = ["native"]

[[example]]
name = "native_encode"
path = "examples/native_encode.rs"
required-features = ["native"]

# Criterion drives its own harness (`harness = false`), so the bench targets must
# not link libtest. These are the targets that measure zvidlib as a whole; each
# codec's own targets live in its crate (#604).
#
# The audio decode path is a separate target rather than another group in
# `codec`: it shares `benches/support/` but none of `codec`'s decoded-frame
# fixtures, and issue #152 specifies `cargo bench --bench audio_decode` as its
# entry point.
[[bench]]
name = "audio_decode"
path = "benches/audio_decode.rs"
harness = false

# The audio write/read path is a separate target rather than another group in
# `codec`: it shares `benches/support/` but none of `codec`'s decoded-frame
# fixtures, and issue #153 specifies `cargo bench --bench audio_mux` as its
# entry point. Container work is cheap enough that its default run stays fast.
[[bench]]
name = "audio_mux"
path = "benches/audio_mux.rs"
harness = false

# Issue #395's measurement: what an exact frame at an arbitrary point of a track
# costs, by backend and by how often the track lets a decode restart. A separate
# target because it is the only one whose fixtures are the paired gop-cadence
# tracks rather than the bundled sample, and because one cold `raps=1` software
# seek decodes a whole group of pictures, which no default run should carry.
[[bench]]
name = "exact_seek"
path = "benches/exact_seek.rs"
harness = false

# The VP8 and VP9 software decoders, and the YUV-to-RGBA output conversion they
# share with the AV1 decoder (issue #574). A separate target because it decodes
# streams the crate's own VP8 and VP9 encoders produce, which no other target
# needs, and because the conversion groups run at 1080p and 4K.
[[bench]]
name = "vpx_decode"
path = "benches/vpx_decode.rs"
harness = false

[build-dependencies]
zvidlib-build = { workspace = true }

[features]
default = []
# Additive, off by default. The crate's SIMD kernels dispatch at run time rather
# than at compile time, so this feature intentionally gates no code today: it is
# the switch the per-codec benchmark tickets code against, and the benchmark
# harness folds `cfg!(feature = "simd")` into every criterion group name
# (`hevc_decode/simd=off` vs `hevc_decode/simd=on`) so the two arms are
# separately recorded and comparable.
simd = []
native = []
web = [
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[dependencies]
zvidlib-core = { workspace = true }
zvidlib-color = { workspace = true }
zvidlib-av1-syntax = { workspace = true }
zvidlib-av1 = { workspace = true }
zvidlib-av1-decoder = { workspace = true }
zvidlib-av1-encoder = { workspace = true }
zvidlib-vp9-syntax = { workspace = true }
zvidlib-hevc-syntax = { workspace = true }
zvidlib-hardware = { workspace = true }
zvidlib-vp8 = { workspace = true }
zvidlib-vp9-decoder = { workspace = true }
zvidlib-vp9-encoder = { workspace = true }
zvidlib-hevc-decoder = { workspace = true }
zvidlib-hevc-encoder = { workspace = true }
zvidlib-opus = { workspace = true }
zvidlib-vorbis-decoder = { workspace = true }
zvidlib-vorbis-encoder = { workspace = true }
zvidlib-aac-encoder = { workspace = true }
zvidlib-container = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.104", optional = true }
wasm-bindgen = { version = "0.2.127", optional = true }
wasm-bindgen-futures = { version = "0.4.77", optional = true }
web-sys = { version = "0.3.104", optional = true, features = [
    "AbortController",
    "AbortSignal",
    # The Web Audio types only the browser tests use, to have Chrome's own media
    # stack decode an Opus MP4 zvidlib wrote.
    "AudioBuffer",
    "AudioData",
    "AudioDataCopyToOptions",
    "AudioDataInit",
    "AudioDecoder",
    "AudioDecoderConfig",
    "AudioDecoderInit",
    "AudioDecoderSupport",
    "AudioEncoder",
    "AudioEncoderConfig",
    "AudioEncoderInit",
    "AudioSampleFormat",
    "BaseAudioContext",
    "Blob",
    "EncodedAudioChunk",
    "EncodedAudioChunkInit",
    "EncodedAudioChunkMetadata",
    "EncodedAudioChunkType",
    "EncodedVideoChunk",
    "EncodedVideoChunkInit",
    "EncodedVideoChunkMetadata",
    "EncodedVideoChunkType",
    "OfflineAudioContext",
    # `performance.now()` is what times the browser preview lookup against the
    # section 3.2 budget; see `web_previews`.
    "Performance",
    "PlaneLayout",
    "ReadableStream",
    "VideoDecoder",
    "VideoDecoderConfig",
    "VideoDecoderInit",
    "VideoDecoderSupport",
    "VideoEncoder",
    "VideoEncoderConfig",
    "VideoEncoderEncodeOptions",
    "VideoEncoderInit",
    "VideoEncoderSupport",
    "VideoFrame",
    "VideoFrameBufferInit",
    "VideoFrameCopyToOptions",
    "VideoPixelFormat",
    "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.77"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }
zvidlib-bench-support = { path = "crates/zvidlib-bench-support" }
glow = "0.18.0"
glutin = "0.32.3"
glutin-winit = "0.5.0"
raw-window-handle = "0.6.2"
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.15.3"

# Native AAC decoding where the operating system has no AAC decoder of its own:
# macOS decodes through AudioToolbox and Windows through Media Foundation, so
# only Linux and the other native targets carry Symphonia's (issue #561).
[target.'cfg(not(any(target_arch = "wasm32", target_os = "macos", windows)))'.dependencies]
symphonia-codec-aac = "0.5.5"
symphonia-core = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

# The native HEVC/AV1 decoders are pure-Rust software codecs with no fast path at opt-level 0,
# so an unoptimized debug build is unusably slow. opt-level 2 keeps debug assertions and fast
# incremental compiles while getting decode throughput much closer to `--release` (which is still
# not real-time for the bundled 1080p sample even at opt-level 3; see the `native_gl` example,
# which decodes on a background thread so the window keeps redrawing smoothly regardless).
[profile.dev]
opt-level = 2

# LTO + a single codegen unit let the optimizer inline and specialize across
# the (crate-internal) hevc decoder's module boundaries, which matters a lot
# for the many small hot per-sample/per-block functions in the decode path.
# The benchmark owns the numbers rather than this comment: run
# `ZVIDLIB_BENCH_LARGE=1 cargo bench --bench codec -- hevc_decode` for the
# whole-frame fps of the bundled 1080p sample per instruction set, and
# `cargo bench --bench codec -- hevc_` for the per-stage breakdown that says
# which kernel a change moved. See benches/README.md.
[profile.release]
lto = "fat"
codegen-units = 1

# Cargo's `bench` profile only inherits `release`'s *defaults*, not the settings
# above, so benchmark numbers would otherwise be measured without the whole-crate
# optimization shipped builds get. Repeat them here so `cargo bench` measures the
# same code generation as `--release`.
[profile.bench]
lto = "fat"
codegen-units = 1
