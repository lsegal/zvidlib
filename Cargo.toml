[package]
name = "zvidlib"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Frame-accurate video and audio I/O for native and WebAssembly applications"
repository = "https://github.com/lsegal/zvidlib"
readme = "README.md"
keywords = ["video", "audio", "webassembly", "webgl", "mp4"]
categories = ["multimedia", "wasm"]
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[example]]
name = "native_gl"
path = "examples/native_gl/main.rs"
required-features = ["native"]

[features]
default = []
native = []
web = [
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.104", optional = true }
wasm-bindgen = { version = "0.2.127", optional = true }
wasm-bindgen-futures = { version = "0.4.77", optional = true }
web-sys = { version = "0.3.104", optional = true, features = [
    "AbortController",
    "AbortSignal",
    "Blob",
    "EncodedVideoChunk",
    "EncodedVideoChunkInit",
    "EncodedVideoChunkType",
    "PlaneLayout",
    "ReadableStream",
    "VideoDecoder",
    "VideoDecoderConfig",
    "VideoDecoderInit",
    "VideoDecoderSupport",
    "VideoFrame",
    "VideoFrameCopyToOptions",
    "VideoPixelFormat",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.77"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
glow = "0.18.0"
glutin = "0.32.3"
glutin-winit = "0.5.0"
raw-window-handle = "0.6.2"
winit = "0.30.13"
