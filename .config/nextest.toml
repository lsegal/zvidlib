# cargo-nextest runs every test as its own process, in parallel across every
# test binary (#595). That is what lets CI run a package's tests in one go
# (#612), and it is also what undoes two things the tests relied on
# under `cargo test`, where a binary's tests were threads of one process and
# the binaries ran one after another. The overrides below put both back.
#
# The grouping is declared on the default profile, so a local `cargo nextest
# run` gets it too; CI's `--profile ci` adds its own overrides on top.

[test-groups]
# `vp9_hardware` and `native_hevc_encoder` take turns through
# an in-process mutex, because the `macos-latest` runner's VideoToolbox fails a
# decode while another session decodes (#565, #580) and a hardware encode timed
# beside other encodes measured them rather than the encoder. A mutex cannot
# reach across processes, so the group does it instead: one hardware test at a
# time, per runner, as the separate `cargo test` steps used to guarantee.
# Every binary that can open a VideoToolbox session on macOS belongs here, not
# only those that ask for hardware by name: `vp9_conformance` and
# `preview_index` decode through the registered factories under `Prefer`,
# which is VideoToolbox on `macos-latest`, and `vp9_conformance` failed
# `native_hevc_encoder`'s AVFoundation decode when the two overlapped (#624).
hardware = { max-threads = 1 }

[[profile.default.overrides]]
filter = '''
    binary(vp9_hardware) | binary(native_hevc_encoder) | binary(native_hevc_hardware)
    | binary(vp9_conformance) | binary(preview_index)
    | (kind(lib) & test(/videotoolbox|windows_mf|nvdec|media_foundation|audiotoolbox|hardware/))
'''
test-group = 'hardware'

# Wall-clock assertions. Under `cargo test` these shared the machine with the
# rest of their own binary at most; nextest would run them beside every other
# binary's tests too, and load only ever slows a trial down (#585). Each
# reserves every slot, so nothing else runs while it is timed.
[[profile.default.overrides]]
filter = '''
    (binary_id(zvidlib-av1) & test(=av1_mc::tests::simd_backends_outrun_the_scalar_kernels))
    | (binary_id(zvidlib-core) & test(=codec::tests::a_seek_to_any_position_answers_inside_the_latency_budget))
    | (binary(native_hevc_encoder) & test(=hardware_encodes_1080p30_faster_than_real_time))
'''
threads-required = 'num-cpus'

[profile.ci]
# Every failure in a job is worth seeing in one run, not just the first.
fail-fast = false
# Failures print where they happen and again in the summary, so a failed job's
# reason is at the bottom of its log.
failure-output = 'immediate-final'

# These were run with `--nocapture` because what they print is the record of
# which backend a host actually selected - hardware or software, and which SIMD
# level - and a passing test that skipped its hardware cases looks exactly like
# one that ran them unless that line is in the log.
[[profile.ci.overrides]]
filter = '''
    binary(vp9_hardware) | binary(native_hevc_hardware) | binary(native_hevc_encoder)
    | binary(vp8_conformance) | binary(native_aac_encoder) | binary(native_aac_decoder)
    | (binary_id(zvidlib-av1) & test(/^av1_mc::|^av1_simd::/))
    | (kind(lib) & test(/libvpx/))
'''
success-output = 'immediate'
